<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Edu-Xpress</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80'); 
            background-size: cover;
            background-position: center;
            height: 100vh; 
            display: flex; 
            align-items: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container { max-width: 450px; margin: auto; }
        .card { 
            border: none; 
            border-radius: 20px; 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .card-header { 
            border-radius: 20px 20px 0 0 !important; 
            background: transparent !important; 
            color: #333 !important; 
            border-bottom: none; 
            padding-top: 40px; 
        }
        .btn-primary { 
            background: #f39c12; 
            border: none; 
            border-radius: 12px; 
            padding: 14px; 
            font-weight: bold; 
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .btn-primary:hover { 
            background: #e67e22; 
            transform: scale(1.02);
        }
        .form-control { 
            border-radius: 12px; 
            padding: 25px 20px; 
            background: #fdfdfd; 
            border: 1px solid #ddd; 
        }
        .form-control:focus {
            border-color: #f39c12;
            box-shadow: 0 0 0 0.2rem rgba(243, 156, 18, 0.25);
        }
        .admin-logo {
            font-size: 3rem;
            color: #f39c12;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card shadow-2xl">
            <div class="card-header text-center">
                <div class="admin-logo"><i class="fas fa-book-reader"></i></div>
                <h2 class="font-weight-bold">Admin Portal</h2>
                <p class="text-muted">Sign in to manage Edu-Xpress</p>
            </div>
            <div class="card-body px-5 pb-5">
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-danger border-0 small">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
                <form method="POST">
                    <div class="form-group">
                        <label class="small font-weight-bold text-uppercase">Email / Username</label>
                        <input type="text" name="username" class="form-control" placeholder="admin@edu-xpress.com" required autofocus>
                    </div>
                    <div class="form-group mb-4">
                        <label class="small font-weight-bold text-uppercase">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block shadow-lg">
                        <i class="fas fa-sign-in-alt mr-2"></i> ACCESS DASHBOARD
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
